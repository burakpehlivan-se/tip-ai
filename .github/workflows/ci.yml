name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tip_ai
          POSTGRES_PASSWORD: tip-ai-test-password
          POSTGRES_DB: tip_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tip_ai -d tip_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://tip_ai:tip-ai-test-password@127.0.0.1:5432/tip_ai_test

      - name: Build
        run: npm run build
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-password' }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET || 'ci-secret-at-least-32-chars-long!!' }}

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: |
          # System deps first; apt is slow on GH runners, so give it room and
          # never kill it mid-run (killing leaves a dpkg lock that poisons retries).
          timeout 420 npx playwright install-deps chromium
          attempts=0
          until npx playwright install chromium; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 4 ]; then
              echo "Playwright Chromium download failed after 4 attempts."
              exit 1
            fi
            echo "Chromium download failed (attempt $attempts/4); retrying in 20s..."
            sleep 20
          done

      - name: Critical student journey
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
